<!DOCTYPE html><html lang="zh-TW">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菜單</title>

<style> 
:root {
  --primary-color: #ff4757;
  --border-color: #eee;
  --text-gray: #666;
}
body {
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  padding: 20px;
  background: white;
}
.menu {
  background: white;
  padding: 25px;
  border: 2px solid var(--border-color);
  border-radius: 2px;
  width: 350px;
}
h3 {
  margin-top: 0;
  border-bottom: 2px solid var(--border-color);
  padding-bottom: 10px;
}
.item {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-color);
}
.info {
  flex: 1;
}
.name {
  font-weight: 600;
  color: #666;
/*  display: block; */
}
.price {
  color: var(--text-gray);
  font-size: 0.9em;
  padding: 0px 0px 0px 10px;
}
.stepper {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn {
  width: 20px;
  height: 20px;
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 10%;
  cursor: pointer;
  transition: 0.2s;
  color: #666;
}
.btn:hover {
  background: #f0f0f0;
  border-color: #bbb;
}
.qty {
  width: 20px;
  text-align: center;
    color: #666;
}
.total-area {
  margin-top: 20px;
  text-align: right;
  font-size: 1.2em;
  font-weight: bold;
}
#grand-total {
  color: var(--primary-color);
  margin-left: 5px;
}
/* 重置按鈕樣式 */

.reset-btn {
  width: 100%;
  margin-top: 15px;
  padding: 10px;
  background: white;
  border: 1px solid #ddd;
  color: var(--text-gray);
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
}
.reset-btn:hover {
  background: #fff5f5;
  color: var(--primary-color);
  border-color: var(--primary-color);
}

</style>
</head>


<body>
  <div class="menu">

        <button class="btn" data-action="minus">-</button><span class="qty">0</span><button class="btn" data-action="plus">+</button>

<!-- ========== --> 
    <div class="item" data-price="500">
      <div class="info">

 <!-- ========== -->

<!-- ========== --> 
    <div class="item" data-price="1000">

<!-- ========== --> 

      <div class="stepper">
        <button class="btn" data-action="minus">-</button><span class="qty">0</span><button class="btn" data-action="plus">+</button>

      </div>

<!-- ========== --> 

    <div class="total-area">
      總計：$<span id="grand-total">0</span>
    </div><!-- 新增重置按鈕 --><button class="reset-btn" id="reset-btn">取消點單</button>
  </div>

<!-- ======================================== --> 

<script>
const menu=document.querySelector('.menu');
const totalDisplay=document.getElementById('grand-total');
const resetBtn=document.getElementById('reset-btn'); // 1. 數量增減邏輯 (事件委派)
menu.addEventListener('click', (e)=> {
  const btn=e.target.closest('.btn');
  if (!btn) return;
  const item=btn.closest('.item');
  const qtySpan=item.querySelector('.qty');
  const action=btn.dataset.action;
  let currentQty=parseInt(qtySpan.textContent);
  if (action==='plus') currentQty++;
  if (action==='minus' && currentQty > 0) currentQty--;
  qtySpan.textContent=currentQty;
  calculateTotal();
}
); // 2. 重置按鈕邏輯
resetBtn.addEventListener('click', ()=> {
  // 將所有數量歸零
  document.querySelectorAll('.qty').forEach(qty=> qty.textContent='0'); // 重新計算總額
  calculateTotal();
}
); // 3. 計算總額邏輯
function calculateTotal() {
  let total=0;
  document.querySelectorAll('.item').forEach(item=> {
    const price=parseInt(item.dataset.price);
    const qty=parseInt(item.querySelector('.qty').textContent);
    total +=price * qty;
  }
  );
  totalDisplay.textContent=total;
}
</script>

</html>
