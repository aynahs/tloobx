<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精簡版點餐菜單</title>

/* ======================================== */       
    <style>
 :root {
    --primary-color: #ff4757;
    --border-color: #eee;
}
body {
    font-family: system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
    background: #f4f7f6;
}

.menu {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    width: 350px;
}
h3 {
    margin-top: 0;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 10px;
}

.item {
    display: flex;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid var(--border-color);
}
.info {
    flex: 1;
}
.name {
    font-weight: 600;
    display: block;
}
.price {
    color: #666;
    font-size: 0.9em;
}

.stepper {
    display: flex;
    align-items: center;
    gap: 10px;
}
.btn {
    width: 30px;
    height: 30px;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.2s;
}
.btn:hover {
    background: #f0f0f0;
    border-color: #bbb;
}
.qty {
    width: 20px;
    text-align: center;
    font-weight: bold;
}

.total-area {
    margin-top: 20px;
    text-align: right;
    font-size: 1.2em;
    font-weight: bold;
}
#grand-total {
    color: var(--primary-color);
    margin-left: 5px;
}
</style > 
  </head>

/* ======================================== */ 
    
  <body>
    <div class="menu">
      <h3>🍴 快速點餐</h3>
      <!-- 使用 data-price 存儲單價 -->
      <div class="item" data-price="150">
        <div class="info">
          <span class="name">牛肉麵</span>
          <span class="price">$150</span>
        </div>
        <div class="stepper">
          <button class="btn" data-action="minus">-</button>
          <span class="qty">0</span>
          <button class="btn" data-action="plus">+</button>
        </div>
      </div>
      <div class="item" data-price="120">
        <div class="info">
          <span class="name">排骨飯</span>
          <span class="price">$120</span>
        </div>
        <div class="stepper">
          <button class="btn" data-action="minus">-</button>
          <span class="qty">0</span>
          <button class="btn" data-action="plus">+</button>
        </div>
      </div>
      <div class="item" data-price="50">
        <div class="info">
          <span class="name">珍珠奶茶</span>
          <span class="price">$50</span>
        </div>
        <div class="stepper">
          <button class="btn" data-action="minus">-</button>
          <span class="qty">0</span>
          <button class="btn" data-action="plus">+</button>
        </div>
      </div>
      <div class="total-area">總計：$
        <span id="grand-total">0</span>
      </div>
    </div>

/* ======================================== */      
    
    <script>
    const menu = document.querySelector('.menu');
    const totalDisplay = document.getElementById('grand-total');

    // 使用事件委派監聽點擊
    menu.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn');
        if (!btn) return;

        const item = btn.closest('.item');
        const qtySpan = item.querySelector('.qty');
        const action = btn.dataset.action;
        
        // 更新數量
        let currentQty = parseInt(qtySpan.textContent);
        if (action === 'plus') currentQty++;
        if (action === 'minus' && currentQty > 0) currentQty--;
        qtySpan.textContent = currentQty;

        calculateTotal();
    });

    // 計算總額邏輯
    function calculateTotal() {
        let total = 0;
        document.querySelectorAll('.item').forEach(item => {
            const price = parseInt(item.dataset.price);
            const qty = parseInt(item.querySelector('.qty').textContent);
            total += price * qty;
        });
        totalDisplay.textContent = total;
    }
</script>
  </body>
</html>
